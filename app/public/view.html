<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>시청 · LiveKit 홈랩</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="card">
    <a class="back" href="/">← 홈</a>
    <h1>💻 시청 <span class="pill tcp">TCP</span></h1>
    <p>룸에 입장해 송출 중인 영상을 시청합니다. (시청자도 시그널링 + 미디어 연결을 합니다)</p>

    <div class="grid">
      <div>
        <label>룸 이름</label>
        <input id="room" />
      </div>
      <div>
        <label>내 ID (viewer)</label>
        <input id="identity" value="pc-viewer" />
      </div>
    </div>
    <div class="row">
      <button id="connect" class="btn primary">시청 시작</button>
      <button id="disconnect" class="btn danger" disabled>나가기</button>
      <button id="startAudio" class="btn" hidden>🔊 소리 켜기</button>
    </div>

    <div id="videos"></div>

    <fieldset id="recordBox" style="margin-top:16px;border:1px solid #334155;border-radius:10px;padding:12px;" hidden>
      <legend style="color:#94a3b8;font-size:.85rem;">녹화 (Egress)</legend>
      <div class="row">
        <div>
          <label>녹화할 송출자 identity</label>
          <input id="recIdentity" value="phone-user" />
        </div>
        <button id="recStart" class="btn ok">● 녹화 시작</button>
        <button id="recStop" class="btn danger" disabled>■ 녹화 중지</button>
      </div>
    </fieldset>

    <div id="status" class="status">준비됨</div>
  </main>

  <script type="module">
    import { loadConfig, loadSdk, getToken, logTo } from '/common.js';

    const $ = (id) => document.getElementById(id);
    const log = logTo($('status'));
    let room, LK, currentEgressId = null;

    (async () => {
      const cfg = await loadConfig();
      $('room').value = cfg.defaultRoom;
      if (cfg.recordingEnabled) $('recordBox').hidden = false;
      LK = await loadSdk(cfg.clientVersion);
      log(`SDK 로드 완료. 시청 준비됨 (룸=${cfg.defaultRoom})`);
    })().catch((e) => log('초기화 오류: ' + e.message));

    function attachTrack(track, participant) {
      const el = track.attach();
      el.setAttribute('playsinline', '');
      if (track.kind === 'video') { el.autoplay = true; el.id = 'v-' + participant.identity; }
      $('videos').appendChild(el);
    }

    $('connect').onclick = async () => {
      try {
        $('connect').disabled = true;
        const { token, wsUrl } = await getToken({
          room: $('room').value, identity: $('identity').value, role: 'viewer',
        });
        room = new LK.Room({ adaptiveStream: true });
        room.on(LK.RoomEvent.TrackSubscribed, (track, _pub, participant) => {
          log('트랙 수신: ' + track.kind + ' from ' + participant.identity);
          attachTrack(track, participant);
        });
        room.on(LK.RoomEvent.TrackUnsubscribed, (track) => track.detach().forEach((e) => e.remove()));
        room.on(LK.RoomEvent.ConnectionStateChanged, (s) => log('연결상태: ' + s));
        room.on(LK.RoomEvent.AudioPlaybackStatusChanged, () => {
          $('startAudio').hidden = room.canPlaybackAudio;
        });

        await room.connect(wsUrl, token);
        log('시그널링 연결됨. 입장 완료.');
        $('disconnect').disabled = false;
      } catch (e) {
        log('오류: ' + e.message);
        $('connect').disabled = false;
      }
    };

    $('startAudio').onclick = async () => { await room?.startAudio(); $('startAudio').hidden = true; };
    $('disconnect').onclick = async () => { await room?.disconnect(); $('videos').innerHTML=''; $('connect').disabled=false; $('disconnect').disabled=true; log('나감'); };

    // ── 녹화 제어 ──
    $('recStart').onclick = async () => {
      try {
        const res = await fetch('/api/record/start', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ room: $('room').value, identity: $('recIdentity').value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'failed');
        currentEgressId = data.egressId;
        $('recStart').disabled = true; $('recStop').disabled = false;
        log('녹화 시작: ' + currentEgressId);
      } catch (e) { log('녹화 시작 오류: ' + e.message); }
    };
    $('recStop').onclick = async () => {
      try {
        const res = await fetch('/api/record/stop', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ egressId: currentEgressId }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'failed');
        $('recStart').disabled = false; $('recStop').disabled = true;
        log('녹화 중지: ' + currentEgressId);
        currentEgressId = null;
      } catch (e) { log('녹화 중지 오류: ' + e.message); }
    };
  </script>
</body>
</html>
